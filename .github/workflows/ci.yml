name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:testing

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git golang-go build-essential curl ffmpeg sudo

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark checkout directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup non-root user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Run build script
        run: sudo -u builder bash -c "cd $GITHUB_WORKSPACE && ./build.sh"

      - name: Run tests
        run: sudo -u builder bash -c "cd $GITHUB_WORKSPACE && go test ./..."
